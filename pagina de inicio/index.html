<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>The Dark Salesman</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: Georgia, "Times New Roman", serif;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			min-height: 100%;
		}

		body {
			min-height: 100vh;
			display: grid;
			place-items: center;
			overflow: hidden;
			background: #090909 url("../piskeles/image.png") center / cover no-repeat;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			background: linear-gradient(180deg, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.72));
			pointer-events: none;
		}

		main {
			position: relative;
			z-index: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 1rem;
			width: min(82vw, 20rem);
		}

		button {
			width: 100%;
			padding: 0.85rem 1.5rem;
			border: 1px solid rgba(255, 255, 255, 0.75);
			background: rgba(8, 8, 8, 0.68);
			color: #fff;
			cursor: pointer;
			font: inherit;
			font-size: 1.2rem;
			letter-spacing: 0.16em;
			transition: background 180ms ease, color 180ms ease, transform 180ms ease;
		}

		button:hover,
		button:focus-visible {
			background: #fff;
			color: #111;
			outline: none;
			transform: translateY(-2px);
		}
	</style>
</head>
<body>
	<main aria-label="Main menu">
		<button type="button">START</button>
		<button type="button">EXIT</button>
	</main>
</body>
</html>
